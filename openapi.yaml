openapi: 3.0.3
info:
  title: Smart Device 120Hz API
  version: 1.0.0
  description: API for managing smart devices.
servers:
  - url: http://localhost:3000
paths:
  /health:
    get:
      summary: Check API health
      responses:
        "200":
          description: API is healthy
  /api/devices:
    get:
      summary: List devices
      responses:
        "200":
          description: A list of devices
    post:
      summary: Create a device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceInput"
      responses:
        "201":
          description: Device created
  /api/devices/{id}:
    get:
      summary: Get a device
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "200":
          description: Device found
        "404":
          description: Device not found
    put:
      summary: Update a device
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceInput"
      responses:
        "200":
          description: Device updated
        "404":
          description: Device not found
    delete:
      summary: Delete a device
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "204":
          description: Device deleted
        "404":
          description: Device not found
components:
  parameters:
    DeviceId:
      name: id
      in: path
      required: true
      schema:
        type: string
  schemas:
    DeviceInput:
      type: object
      required:
        - name
        - type
      properties:
        name:
          type: string
        type:
          type: string
        status:
          type: string
          enum:
            - active
            - inactive
